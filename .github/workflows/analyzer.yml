name: Analyzer

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tala-analyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyzer:
    name: Compiler-backed analysis
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.1"

      - name: Check analyzer configuration DSL
        shell: pwsh
        run: .\Tazel\gradlew.bat -p Ecosystem/tala-analyzer spotlessCheck test

      - name: Update Hackage package index
        shell: pwsh
        run: cabal update

      - name: Build tala-analyzer
        shell: pwsh
        working-directory: Talac
        run: cabal build tala-analyzer --disable-optimization

      - name: Test tala-analyzer
        shell: pwsh
        working-directory: Talac
        run: cabal test tala-analyzer-tests --disable-optimization

      - name: Check package metadata
        shell: pwsh
        working-directory: Ecosystem/tala-analyzer
        run: cabal check

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check

  vscode-host:
    name: VS Code host
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: Ecosystem/tala-analyzer/vscode/package-lock.json

      - name: Check extension types
        shell: pwsh
        working-directory: Ecosystem/tala-analyzer/vscode
        run: |
          npm ci
          npm run check

  intellij-host:
    name: IntelliJ Platform host
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.1"

      - name: Compile IntelliJ plugin
        shell: pwsh
        run: .\Tazel\gradlew.bat -p Ecosystem/tala-analyzer/intellij compileKotlin processResources dokkaGenerateHtml

  kotlin-config:
    name: Kotlin configuration model
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "9.6.1"

      - name: Test, format, and generate Kotlin API documentation
        shell: pwsh
        run: .\Tazel\gradlew.bat -p Ecosystem/tala-analyzer check jacocoTestReport spotlessCheck
