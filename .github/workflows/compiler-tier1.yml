name: Compiler Tier 1

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compiler-tier1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-clangcl:
    name: Windows ClangCL
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          # Dependency versions and checksums live in helpers/go.mod and go.sum.
          cache: false

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: native-windows-clangcl
          repository-cache: true

      - name: Restore LLVM development package
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.tool_cache }}\llvm-dev-22.1.6
          key: llvm-dev-22.1.6-x86_64-windows-msvc

      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "bin\llvm-config.exe"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
          }
          if (-not (Test-Path $llvmConfig)) {
            throw "The official LLVM development archive does not contain llvm-config.exe"
          }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Compiler
        run: cabal update

      - name: Verify Windows toolchain
        shell: pwsh
        run: |
          bazel --version
          clang-cl --version
          lld-link --version
          llvm-config --version

      - name: Test repository Go helpers
        shell: pwsh
        run: |
          go run ./helpers/cmd/verify-helpers
          go run ./helpers/cmd/verify-examples
          go run ./helpers/cmd/verify-benchmarks
          go run ./helpers/cmd/execution-cases check

      - name: Verify project C++ formatting
        shell: pwsh
        run: |
          $wheel = Join-Path $env:RUNNER_TEMP "clang_format-23.1.0-py2.py3-none-win_amd64.whl"
          curl.exe -L --fail --retry 4 --retry-delay 3 `
            -o $wheel `
            "https://files.pythonhosted.org/packages/95/19/501001c2aa10dff69eb3ec3802851abafbdd3adeb06db152fef553b5ef00/clang_format-23.1.0-py2.py3-none-win_amd64.whl"

          $expectedHash = "c10a99dc55a5630bbf6135f004e057d1a3153e4f54cda3f67e0c0b5a150d1cdd"
          $actualHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $wheel).Hash.ToLowerInvariant()
          if ($actualHash -ne $expectedHash) {
            throw "clang-format wheel SHA-256 mismatch: $actualHash"
          }

          python -m pip install --disable-pip-version-check --no-deps $wheel
          if ($LASTEXITCODE -ne 0) {
            throw "Could not install the pinned clang-format wheel"
          }

          $formatter = python -c "import clang_format; print(clang_format.get_executable('clang-format'))"
          & $formatter --version
          $files = @(git ls-files -- '*.cpp' '*.hpp' '*.hh' '*.h' ':!third_party/**')
          if ($files.Count -eq 0) {
            throw "No project-owned C or C++ files were selected for formatting"
          }
          & $formatter --dry-run --Werror --style=file @files
          if ($LASTEXITCODE -ne 0) {
            throw "Project-owned C or C++ files are not formatted"
          }

      - name: Build native compiler
        shell: pwsh
        run: go run ./helpers/cmd/develop doctor

      - name: Test native compiler
        shell: pwsh
        run: go run ./helpers/cmd/develop test

      - name: Verify ASan and UBSan runtimes and native suites
        shell: pwsh
        run: go run ./helpers/cmd/develop sanitize address-undefined

      - name: Exercise native wire decoder mutations
        shell: pwsh
        run: |
          bazel build //Compiler/Fuzzing:wire_fuzz_smoke
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bazel-bin\Compiler\Fuzzing\wire_fuzz_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  macos-clang:
    name: ${{ matrix.name }} Clang
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Sequoia
            runner: macos-15
            sanitizer: address-undefined
          - name: macOS Tahoe
            runner: macos-26
            sanitizer: address-undefined
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: native-${{ matrix.runner }}-clang
          repository-cache: true

      - name: Install LLVM development package
        shell: bash
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          llvm_root="$(brew --prefix llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"

      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Compiler
        run: cabal update

      - name: Verify macOS toolchain
        shell: bash
        run: go run ./helpers/cmd/develop doctor

      - name: Test repository Go helpers
        shell: bash
        run: |
          go run ./helpers/cmd/verify-helpers
          go run ./helpers/cmd/verify-examples
          go run ./helpers/cmd/verify-benchmarks
          go run ./helpers/cmd/execution-cases check

      - name: Test native compiler
        shell: bash
        run: go run ./helpers/cmd/develop test

      - name: Exercise native wire decoder mutations
        shell: bash
        run: |
          bazel build //Compiler/Fuzzing:wire_fuzz_smoke
          ./bazel-bin/Compiler/Fuzzing/wire_fuzz_smoke

      - name: Test native compiler with ${{ matrix.sanitizer }} sanitizer
        shell: bash
        run: go run ./helpers/cmd/develop sanitize ${{ matrix.sanitizer }}

      - name: Verify separate ThreadSanitizer runtime and native suites
        shell: bash
        run: go run ./helpers/cmd/develop sanitize thread

  required:
    name: Compiler Tier 1 Required
    runs-on: ubuntu-26.04
    if: always()
    needs: [windows-clangcl, macos-clang]
    steps:
      - name: Require every native and sanitizer host
        run: |
          test '${{ needs.windows-clangcl.result }}' = success
          test '${{ needs.macos-clang.result }}' = success
