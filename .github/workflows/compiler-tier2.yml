name: Compiler Tier 2

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main
  # By hand, for a branch that has no pull request yet:
  # `go run ./helpers/cmd/cross-platform-test ci`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compiler-tier2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  ubuntu-clang:
    name: Ubuntu 26.04 LTS Clang
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: compiler-ubuntu-2604-clang
          repository-cache: true

      - name: Install LLVM development and link packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libzstd-dev libxml2-dev zlib1g-dev zstd
          # LLVM built with libc++ from the toolchain release, checked against
          # the digest the repository records; the compiler builds with libc++.
          llvm_root="$(go run ./helpers/cmd/develop llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          test -f "$(clang -print-resource-dir)/include/stddef.h"

      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Verify toolchain and Go helpers
        shell: bash
        run: |
          go run ./helpers/cmd/develop doctor
          go run ./helpers/cmd/verify-helpers
          go run ./helpers/cmd/verify-examples
          go run ./helpers/cmd/verify-abi
          go run ./helpers/cmd/verify-benchmarks
          go run ./helpers/cmd/execution-cases check

      - name: Build and run native compiler suites
        shell: bash
        run: go run ./helpers/cmd/develop test

      # Stages the programs of this host as a distribution and runs them
      # from it: talac compiles Examples/HelloWorld through the staged
      # frontend, and the program must print its greeting.
      - name: Stage and smoke-test the host distribution
        shell: bash
        run: go run ./helpers/cmd/develop bundle

      - name: Exercise wire decoder mutations
        shell: bash
        run: |
          bazel build //Talac/Fuzzing:wire_fuzz_smoke
          ./bazel-bin/Talac/Fuzzing/wire_fuzz_smoke

      - name: Verify ASan and UBSan runtimes and native suites
        shell: bash
        run: go run ./helpers/cmd/develop sanitize address-undefined

      - name: Verify separate ThreadSanitizer runtime and native suites
        shell: bash
        run: go run ./helpers/cmd/develop sanitize thread

  required:
    name: Compiler Tier 2 Required
    runs-on: ubuntu-26.04
    if: always()
    needs: [changes, ubuntu-clang]
    steps:
      - name: Require the native and sanitizer host
        env:
          NATIVE: ${{ needs.changes.outputs.native }}
        run: |
          test '${{ needs.changes.result }}' = success
          if [ "$NATIVE" = true ]; then
            test '${{ needs.ubuntu-clang.result }}' = success
          fi
