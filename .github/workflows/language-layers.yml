name: Language Layers

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: language-layers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language-layers:
    name: Project DSL and compiler
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"

      - name: Check Kotlin project runtime
        shell: pwsh
        run: .\Tazel\gradlew.bat -p Tazel check

      - name: Update Hackage package index
        shell: pwsh
        working-directory: Talac
        run: cabal update

      - name: Build Haskell compiler layers
        shell: pwsh
        working-directory: Talac
        # tala-frontend-host holds the shared library talac loads.
        run: cabal build tala-compiler tala-frontend-host

      - name: Test Haskell compiler layers
        shell: pwsh
        working-directory: Talac
        run: cabal test tala-compiler-tests

      - name: Test frontend fuzz feedback and mutation policy
        shell: pwsh
        working-directory: Talac
        run: cabal test fuzz-feedback-tests

      - name: Check Haskell package metadata
        shell: pwsh
        run: |
          $packageDirectories = @(
            "Talac/Haskell/Syntax",
            "Talac/Haskell/Frontend",
            "Talac/Haskell/Core",
            "Talac/Haskell/Driver",
            "Talac/Haskell/Tooling",
            "Talac/Haskell/Host"
          )
          foreach ($directory in $packageDirectories) {
            Push-Location $directory
            try {
              cabal check
              if ($LASTEXITCODE -ne 0) {
                throw "cabal check failed for $directory"
              }
            } finally {
              Pop-Location
            }
          }

      # The packages published to Hackage carry the license and its exception
      # in their own directories, because a source archive holds only what is
      # below the package. The copies must not drift from the repository's.
      - name: Check the license copies of the published packages
        shell: pwsh
        run: |
          foreach ($directory in @("Syntax", "Frontend", "Core", "Driver", "Tooling")) {
            $package = "Talac/Haskell/$directory"
            foreach ($pair in @(@("LICENSE.txt", "LICENSE"), @("LICENSES/AdditionRef-Progmasoft-Exception-1.1.txt", "LICENSE-EXCEPTION"))) {
              $expected = (Get-FileHash $pair[0]).Hash
              $actual = (Get-FileHash (Join-Path $package $pair[1])).Hash
              if ($expected -ne $actual) {
                throw "$package/$($pair[1]) differs from $($pair[0])"
              }
            }
          }

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
