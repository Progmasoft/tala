name: Coverage-Guided Fuzzing

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seconds:
        description: Per-target manual campaign seconds (1-3600)
        type: number
        default: 90
        required: false
  schedule:
    - cron: '17 2 * * *'

env:
  TALA_FUZZ_SECONDS: ${{ inputs.seconds || '90' }}

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ClangCL libFuzzer
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-windows-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-windows-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-windows-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-windows-clangcl
          repository-cache: true
      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "bin\llvm-config.exe"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $llvmConfig)) { throw "llvm-config.exe is missing" }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: pwsh
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          TALA_FUZZ_SECONDS: '900'
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: ${{ matrix.runner }} Clang libFuzzer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15-intel, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-${{ matrix.runner }}-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-${{ matrix.runner }}-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-${{ matrix.runner }}-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-${{ matrix.runner }}-clang
          repository-cache: true
      - name: Install LLVM development package
        shell: bash
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          llvm_root="$(brew --prefix llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Pin the SDK of the selected Xcode
        shell: bash
        run: |
          # The Command Line Tools SDK can be newer than the linker of the
          # selected Xcode: SDK 27.0 lists arm64e.x1, which ld of Xcode 26
          # rejects as a malformed file. Homebrew clang's configuration files
          # and the GHC installation name that SDK by path, which overrides
          # SDKROOT, so every such reference is pointed at the selected SDK.
          sdk="$(xcrun --show-sdk-path)"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          clt='/Library/Developer/CommandLineTools/SDKs/MacOSX[0-9.]*sdk'
          libdir="$(ghc --print-libdir)"
          changed=0
          for file in "$LLVM_ROOT"/etc/clang/*.cfg \
              "$(brew --prefix)"/etc/clang/*.cfg \
              "$libdir/settings" "$libdir"/package.conf.d/*.conf; do
            if [ -f "$file" ] && grep -Eq "$clt" "$file"; then
              echo "Pinning $sdk in $file"
              sed -E -i '' "s#$clt#$sdk#g" "$file"
              changed=1
            fi
          done
          if [ "$changed" = 1 ]; then
            ghc-pkg recache --global
          else
            echo "No reference to the Command Line Tools SDK was found"
          fi
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run bounded ThreadSanitizer ownership campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-thread
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: bash
        env:
          TALA_FUZZ_SECONDS: '900'
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  ubuntu:
    name: Ubuntu 26.04 Clang libFuzzer
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-ubuntu-2604-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-ubuntu-2604-clang
          repository-cache: true
      - name: Install LLVM development package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libzstd-dev libxml2-dev zlib1g-dev zstd
          # LLVM built with libc++ from the toolchain release, checked against
          # the digest the repository records; the compiler builds with libc++.
          llvm_root="$(go run ./helpers/cmd/develop llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          test -f "$(clang -print-resource-dir)/include/stddef.h"
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run bounded ThreadSanitizer ownership campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-thread
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: bash
        env:
          TALA_FUZZ_SECONDS: '900'
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-ubuntu-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  afl:
    name: Ubuntu 26.04 AFL++
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      # The corpus is the Ubuntu libFuzzer job's: AFL++ starts from what
      # libFuzzer kept and saves what it adds under the same key prefix, so
      # the next libFuzzer run restores it in turn.
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-afl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-ubuntu-2604-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-ubuntu-2604-afl
          repository-cache: true
      - name: Install LLVM and AFL++
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libzstd-dev libxml2-dev zlib1g-dev zstd afl++
          # LLVM built with libc++ from the toolchain release, checked against
          # the digest the repository records; the compiler builds with libc++.
          llvm_root="$(go run ./helpers/cmd/develop llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          afl-fuzz -h 2>&1 | head -n 1 || true
      - name: Run bounded AFL++ campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-afl
      - name: Preserve campaign reports and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-afl-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  fedora:
    name: Fedora 43 Clang libFuzzer
    runs-on: ubuntu-26.04
    container: fedora:43
    timeout-minutes: 300
    steps:
      - name: Install checkout and compiler prerequisites
        shell: bash
        run: |
          dnf install -y git ca-certificates curl tar gzip unzip xz which findutils \
            clang lld libcxx-devel libcxxabi-devel zstd libzstd-devel libxml2-devel \
            zlib-devel golang gcc gcc-c++ make gmp-devel libffi-devel ncurses-devel perl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Bazelisk
        shell: bash
        run: |
          go install github.com/bazelbuild/bazelisk@v1.29.0
          # Container jobs do not consistently propagate GITHUB_PATH entries
          # into later container steps. Expose the pinned Bazelisk as `bazel`
          # explicitly so develop.go can find it.
          install -m 0755 "$(go env GOPATH)/bin/bazelisk" /usr/local/bin/bazel
          # LLVM built with libc++ from the toolchain release, checked against
          # the digest the repository records; the compiler builds with libc++.
          llvm_root="$(go run ./helpers/cmd/develop llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          test -f "$(clang -print-resource-dir)/include/stddef.h"
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-fedora-43-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-fedora-43-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-fedora-43-
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: bash
        env:
          TALA_FUZZ_SECONDS: '900'
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-fedora-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Fuzzing Required
    runs-on: ubuntu-26.04
    if: always()
    needs: [windows, macos, ubuntu, afl, fedora]
    steps:
      - name: Require every bounded fuzz host
        run: |
          test '${{ needs.windows.result }}' = success
          test '${{ needs.macos.result }}' = success
          test '${{ needs.ubuntu.result }}' = success
          test '${{ needs.afl.result }}' = success
          test '${{ needs.fedora.result }}' = success
