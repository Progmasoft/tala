name: Coverage-Guided Fuzzing

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seconds:
        description: Per-target manual campaign seconds (1-3600)
        type: number
        default: 90
        required: false
  schedule:
    - cron: '17 2 * * *'

env:
  TALA_FUZZ_SECONDS: ${{ inputs.seconds || '90' }}

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  windows:
    name: Windows ClangCL libFuzzer
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-windows-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-windows-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-windows-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-windows-clangcl
          repository-cache: true
      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "bin\llvm-config.exe"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $llvmConfig)) { throw "llvm-config.exe is missing" }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: pwsh
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          TALA_FUZZ_SECONDS: '900'
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  ubuntu:
    name: Ubuntu 26.04 Clang libFuzzer
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-ubuntu-2604-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-ubuntu-2604-clang
          repository-cache: true
      - name: Install LLVM development package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libzstd-dev libxml2-dev zlib1g-dev zstd
          # LLVM built with libc++ from the toolchain release, checked against
          # the digest the repository records; the compiler builds with libc++.
          llvm_root="$(go run ./helpers/cmd/develop llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          test -f "$(clang -print-resource-dir)/include/stddef.h"
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run bounded ThreadSanitizer ownership campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-thread
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: bash
        env:
          TALA_FUZZ_SECONDS: '900'
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-ubuntu-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  afl:
    name: Ubuntu 26.04 AFL++
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false
      # The corpus is the Ubuntu libFuzzer job's: AFL++ starts from what
      # libFuzzer kept and saves what it adds under the same key prefix, so
      # the next libFuzzer run restores it in turn.
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/tala-fuzz-corpus
          key: tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}-afl-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            tala-fuzz-ubuntu-2604-${{ hashFiles('Talac/Fuzzing/Corpus/**') }}
            tala-fuzz-ubuntu-2604-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-ubuntu-2604-afl
          repository-cache: true
      - name: Install LLVM and AFL++
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld libc++-dev libc++abi-dev libzstd-dev libxml2-dev zlib1g-dev zstd afl++
          # LLVM built with libc++ from the toolchain release, checked against
          # the digest the repository records; the compiler builds with libc++.
          llvm_root="$(go run ./helpers/cmd/develop llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          afl-fuzz -h 2>&1 | head -n 1 || true
      - name: Run bounded AFL++ campaign
        shell: bash
        env:
          TALA_FUZZ_CORPUS: ${{ runner.temp }}/tala-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-afl
      - name: Preserve campaign reports and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-afl-${{ github.run_id }}
          path: ${{ runner.temp }}/tala-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Fuzzing Required
    runs-on: ubuntu-26.04
    if: always()
    needs: [changes, windows, ubuntu, afl]
    steps:
      - name: Require every bounded fuzz host
        env:
          NATIVE: ${{ needs.changes.outputs.native }}
        run: |
          test '${{ needs.changes.result }}' = success
          if [ "$NATIVE" = true ]; then
            test '${{ needs.windows.result }}' = success
            test '${{ needs.ubuntu.result }}' = success
            test '${{ needs.afl.result }}' = success
          fi
