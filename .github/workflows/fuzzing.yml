name: Coverage-Guided Fuzzing

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      seconds:
        description: Per-target manual campaign seconds (1-3600)
        type: number
        default: 90
        required: false
  schedule:
    - cron: '17 2 * * *'

env:
  VXS_FUZZ_SECONDS: ${{ inputs.seconds || '90' }}

permissions:
  contents: read

concurrency:
  group: fuzzing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows ClangCL libFuzzer
    runs-on: windows-2025-vs2026
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vxs-fuzz-corpus
          key: vxs-fuzz-windows-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vxs-fuzz-windows-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}
            vxs-fuzz-windows-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-windows-clangcl
          repository-cache: true
      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "bin\llvm-config.exe"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path $llvmConfig)) { throw "llvm-config.exe is missing" }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Compiler
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: pwsh
        env:
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          VXS_FUZZ_SECONDS: '900'
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-windows-${{ github.run_id }}
          path: ${{ runner.temp }}/vxs-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: ${{ matrix.runner }} Clang libFuzzer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vxs-fuzz-corpus
          key: vxs-fuzz-${{ matrix.runner }}-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vxs-fuzz-${{ matrix.runner }}-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}
            vxs-fuzz-${{ matrix.runner }}-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-${{ matrix.runner }}-clang
          repository-cache: true
      - name: Install LLVM development package
        shell: bash
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          llvm_root="$(brew --prefix llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          echo "$llvm_root/bin" >> "$GITHUB_PATH"
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Compiler
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: bash
        env:
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run bounded ThreadSanitizer ownership campaign
        shell: bash
        env:
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-thread
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: bash
        env:
          VXS_FUZZ_SECONDS: '900'
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-${{ matrix.runner }}-${{ github.run_id }}
          path: ${{ runner.temp }}/vxs-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  ubuntu:
    name: Ubuntu 26.04 Clang libFuzzer
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vxs-fuzz-corpus
          key: vxs-fuzz-ubuntu-2604-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vxs-fuzz-ubuntu-2604-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}
            vxs-fuzz-ubuntu-2604-
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: fuzz-ubuntu-2604-clang
          repository-cache: true
      - name: Install LLVM development package
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm-dev libzstd-dev libxml2-dev zlib1g-dev
          llvm_root="$(llvm-config --prefix)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          test -f "$(clang -print-resource-dir)/include/stddef.h"
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Compiler
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: bash
        env:
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run bounded ThreadSanitizer ownership campaign
        shell: bash
        env:
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-thread
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: bash
        env:
          VXS_FUZZ_SECONDS: '900'
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-ubuntu-${{ github.run_id }}
          path: ${{ runner.temp }}/vxs-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  fedora:
    name: Fedora 43 Clang libFuzzer
    runs-on: ubuntu-26.04
    container: fedora:43
    timeout-minutes: 300
    steps:
      - name: Install checkout and compiler prerequisites
        shell: bash
        run: |
          dnf install -y git ca-certificates curl tar gzip unzip xz which findutils \
            clang lld llvm-devel llvm-static libzstd-devel libxml2-devel \
            zlib-devel golang gcc gcc-c++ make gmp-devel libffi-devel ncurses-devel perl
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Bazelisk
        shell: bash
        run: |
          go install github.com/bazelbuild/bazelisk@v1.29.0
          # Container jobs do not consistently propagate GITHUB_PATH entries
          # into later container steps. Expose the pinned Bazelisk as `bazel`
          # explicitly so develop.go can find it.
          install -m 0755 "$(go env GOPATH)/bin/bazelisk" /usr/local/bin/bazel
          llvm_root="$(llvm-config --prefix)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          test -f "$(clang -print-resource-dir)/include/stddef.h"
      - name: Restore synchronized fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/vxs-fuzz-corpus
          key: vxs-fuzz-fedora-43-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vxs-fuzz-fedora-43-${{ hashFiles('Compiler/Fuzzing/Corpus/**') }}
            vxs-fuzz-fedora-43-
      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Compiler
        run: cabal update

      - name: Run bounded coverage-guided campaign
        shell: bash
        env:
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz
      - name: Run nightly ASan and UBSan stress campaign
        if: github.event_name == 'schedule'
        shell: bash
        env:
          VXS_FUZZ_SECONDS: '900'
          VXS_FUZZ_CORPUS: ${{ runner.temp }}/vxs-fuzz-corpus
        run: go run ./helpers/cmd/develop fuzz-stress --asan
      - name: Preserve campaign reports and crashing corpus
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-fedora-${{ github.run_id }}
          path: ${{ runner.temp }}/vxs-fuzz-*/
          if-no-files-found: warn
          retention-days: 14

  required:
    name: Fuzzing Required
    runs-on: ubuntu-26.04
    if: always()
    needs: [windows, macos, ubuntu, fedora]
    steps:
      - name: Require every bounded fuzz host
        run: |
          test '${{ needs.windows.result }}' = success
          test '${{ needs.macos.result }}' = success
          test '${{ needs.ubuntu.result }}' = success
          test '${{ needs.fedora.result }}' = success
