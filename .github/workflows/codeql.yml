name: CodeQL

on:
  pull_request:
  # The default branch only. A branch that has a pull request is analysed by
  # the pull request; analysing its pushes as well ran every job twice. A tag
  # names a commit that was analysed when it reached the default branch;
  # analysing it again under the tag adds nothing and leaves a second record
  # that can fail on its own.
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

# Each job asks for what it needs: both upload their results to code scanning.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
          - language: c-cpp
            build_mode: none
          - language: go
            build_mode: manual
          - language: java-kotlin
            build_mode: manual
          - language: javascript-typescript
            build_mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'

      - name: Install Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Build Kotlin owners for extraction
        if: matrix.language == 'java-kotlin'
        shell: pwsh
        run: |
          # The build downloads its Gradle plugins, and the repositories
          # sometimes refuse a runner for a moment (403, or a POM that cannot
          # be read). Such a failure is not one of this repository, so the
          # build is tried again after a pause. A failure of the sources
          # fails every attempt and is reported after the last.
          foreach ($component in @('Tazel', 'Ecosystem/tala-analyzer', 'Ecosystem/talafmt', 'Ecosystem/talalint')) {
            $attempts = 3
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              gradle -p $component classes --rerun-tasks --no-build-cache
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq $attempts) {
                throw "CodeQL Kotlin extraction build failed for $component after $attempts attempts"
              }
              Write-Host "::warning::Gradle build of $component failed (attempt $attempt of $attempts); trying again."
              Start-Sleep -Seconds (30 * $attempt)
            }
          }

      - name: Build Go helpers for extraction
        if: matrix.language == 'go'
        shell: pwsh
        run: |
          go -C helpers build -a ./...
          if ($LASTEXITCODE -ne 0) { throw "CodeQL Go helper extraction build failed" }
          go run ./helpers/cmd/verify-helpers
          if ($LASTEXITCODE -ne 0) {
            throw "CodeQL Go extraction failed while validating helpers/"
          }

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

      # C and C++ are analysed here without a build: the extractor reads the
      # sources and guesses how they would be compiled. That is fast enough
      # for every pull request and needs no LLVM on the runner, but it
      # resolves few includes and so understands little of what it reads;
      # the `c-cpp-traced` job is the analysis that compiles. This step only
      # requires that the sources reached the database, and prints the rest.
      - name: Measure what the C++ analysis covered
        if: matrix.language == 'c-cpp'
        shell: pwsh
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: |
          ./.github/codeql/Measure-CppAnalysis.ps1 `
            -Database (Join-Path $env:RUNNER_TEMP 'codeql_databases/cpp') `
            -Codeql $env:CODEQL

  # C and C++ analysed from a real build. CodeQL watches the compiler while
  # Bazel compiles every native target, so each source is read with the
  # include paths, definitions and language options it is really compiled
  # with, and the standard library and LLVM are resolved.
  #
  # That costs a full compilation without any cache, so it does not run for
  # every pull request: it runs when the default branch changes, once a week,
  # on request, and for a pull request that carries the label
  # `codeql-traced`, which is how a change of this job is tried.
  cpp-traced:
    name: c-cpp-traced
    if: >-
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'codeql-traced')
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      # No disk cache: an object taken from a cache is not compiled, and a
      # source that is not compiled is not seen.
      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true

      - name: Install LLVM development and link packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm-dev libzstd-dev libxml2-dev zlib1g-dev
          llvm_root="$(llvm-config --prefix)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          test -f "$(clang -print-resource-dir)/include/stddef.h"

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp
          build-mode: manual
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      # Every native target is compiled and none is linked: the analysis
      # reads compilations, and the fuzz targets link only under their own
      # configuration. Actions run outside the sandbox and take nothing from
      # a cache, so that each compiler invocation is one CodeQL observes.
      - name: Compile every native target for extraction
        shell: bash
        run: |
          bazel shutdown
          bazel build \
            --spawn_strategy=local \
            --nouse_action_cache \
            --noremote_accept_cached \
            --noremote_upload_local_results \
            --disk_cache= \
            --output_groups=compilation_outputs \
            -- //Talac/... //Interactive/...
          bazel shutdown

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:c-cpp/build:traced

      # The floors are what makes this job worth its time: with a build the
      # extractor has to resolve the includes and compile the sources, and a
      # run that does not is the shallow analysis under another name. The
      # first traced run resolved every include and compiled every source
      # without an error, and held all native sources but the one that is
      # compiled for Windows only.
      - name: Measure what the C++ analysis covered
        shell: pwsh
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: |
          ./.github/codeql/Measure-CppAnalysis.ps1 `
            -Database (Join-Path $env:RUNNER_TEMP 'codeql_databases/cpp') `
            -Codeql $env:CODEQL `
            -IncludeFloor 95 `
            -CompilationFloor 95
