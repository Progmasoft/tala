name: CodeQL

on:
  pull_request:
  # The default branch only. A branch that has a pull request is analysed by
  # the pull request; analysing its pushes as well ran every job twice. A tag
  # names a commit that was analysed when it reached the default branch;
  # analysing it again under the tag adds nothing and leaves a second record
  # that can fail on its own.
  push:
    branches:
      - main
  schedule:
    - cron: '23 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: ${{ matrix.language }}
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build_mode: none
          - language: c-cpp
            build_mode: none
          - language: go
            build_mode: manual
          - language: java-kotlin
            build_mode: manual
          - language: javascript-typescript
            build_mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '9.6.1'

      - name: Install Go
        if: matrix.language == 'go'
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build_mode }}
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-extended

      - name: Build Kotlin owners for extraction
        if: matrix.language == 'java-kotlin'
        shell: pwsh
        run: |
          # The build downloads its Gradle plugins, and the repositories
          # sometimes refuse a runner for a moment (403, or a POM that cannot
          # be read). Such a failure is not one of this repository, so the
          # build is tried again after a pause. A failure of the sources
          # fails every attempt and is reported after the last.
          foreach ($component in @('ProjectSystem', 'Analyzer', 'Formatter', 'Linter')) {
            $attempts = 3
            for ($attempt = 1; $attempt -le $attempts; $attempt++) {
              gradle -p $component classes --rerun-tasks --no-build-cache
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq $attempts) {
                throw "CodeQL Kotlin extraction build failed for $component after $attempts attempts"
              }
              Write-Host "::warning::Gradle build of $component failed (attempt $attempt of $attempts); trying again."
              Start-Sleep -Seconds (30 * $attempt)
            }
          }

      - name: Build Go helpers for extraction
        if: matrix.language == 'go'
        shell: pwsh
        run: |
          go -C helpers build -a ./...
          if ($LASTEXITCODE -ne 0) { throw "CodeQL Go helper extraction build failed" }
          go run ./helpers/cmd/verify-helpers
          if ($LASTEXITCODE -ne 0) {
            throw "CodeQL Go extraction failed while validating helpers/"
          }

      - name: Analyze
        uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401 # v4
        with:
          category: /language:${{ matrix.language }}

      # C and C++ are analysed without a build: the extractor reads the
      # sources and guesses how they would be compiled. That is fast and
      # needs no LLVM on the runner, and it can silently analyse less than
      # the repository has. This step measures what the analysis saw.
      #
      # It fails when fewer of the native sources reached the database than
      # the floor allows. The other figures, the includes the extractor could
      # not resolve and its own quality report, are written to the job
      # summary; they have no floor until they have been seen for a while.
      - name: Measure what the C++ analysis covered
        if: matrix.language == 'c-cpp'
        shell: pwsh
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $database = Join-Path $env:RUNNER_TEMP 'codeql_databases/cpp'
          $summary = $env:GITHUB_STEP_SUMMARY

          # The native sources the repository owns.
          $owned = @(git ls-files -- 'Compiler/*.cpp' 'Compiler/*.hpp' 'Compiler/*.h' 'Compiler/*.inc' `
              'Interactive/*.cpp' 'Interactive/*.hpp' 'Interactive/*.h' |
              Where-Object { $_ -notlike 'Compiler/Haskell/*' })
          if ($owned.Count -eq 0) { throw 'no native sources were found to compare with' }

          # The sources the database holds: every file the extractor read is
          # kept in its source archive.
          $archive = Join-Path $database 'src.zip'
          if (-not (Test-Path -LiteralPath $archive)) { throw "the CodeQL database has no source archive at $archive" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($archive)
          try { $held = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\', '/') }) } finally { $zip.Dispose() }

          $missing = @($owned | Where-Object { $path = "/$_"; -not ($held | Where-Object { $_.EndsWith($path) } | Select-Object -First 1) })
          $seen = $owned.Count - $missing.Count
          $share = [math]::Round(100.0 * $seen / $owned.Count, 1)
          $floor = 95.0

          "## C++ analysis coverage" >> $summary
          "" >> $summary
          "| Measure | Value |" >> $summary
          "| --- | --- |" >> $summary
          "| Native sources in the repository | $($owned.Count) |" >> $summary
          "| Of them in the CodeQL database | $seen ($share %) |" >> $summary
          "| Floor | $floor % |" >> $summary
          if ($missing.Count -gt 0) {
            "" >> $summary
            "Not in the database:" >> $summary
            "" >> $summary
            $missing | Select-Object -First 50 | ForEach-Object { "- ``$_``" >> $summary }
          }

          # What the extractor reports about itself. Each result set is one
          # query of the CodeQL C++ pack; the names are the pack's.
          $results = Join-Path $database 'results'
          $reports = @()
          if (Test-Path -LiteralPath $results) {
            $reports = @(Get-ChildItem -LiteralPath $results -Recurse -Filter *.bqrs |
                Where-Object { $_.FullName -match '[\\/](Summary|Telemetry|Diagnostics)[\\/]' } | Sort-Object FullName)
          }
          foreach ($report in $reports) {
            $rows = @(& $env:CODEQL bqrs decode --format=csv --rows=40 -- $report.FullName 2>$null)
            if ($LASTEXITCODE -ne 0 -or $rows.Count -eq 0) { continue }
            "" >> $summary
            "### $($report.Directory.Name) / $($report.BaseName)" >> $summary
            "" >> $summary
            '```text' >> $summary
            $rows | ForEach-Object { $_ >> $summary }
            '```' >> $summary
          }
          if ($reports.Count -eq 0) {
            "" >> $summary
            "The database holds no summary or telemetry results to show." >> $summary
          }

          Write-Host "C++ analysis: $seen of $($owned.Count) native sources are in the database ($share %)."
          if ($share -lt $floor) {
            throw "CodeQL analysed $share % of the native sources; the floor is $floor %."
          }
