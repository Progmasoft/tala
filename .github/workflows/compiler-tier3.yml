name: Compiler Tier 3

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compiler-tier3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fedora-clang:
    name: Fedora 43 Clang
    runs-on: ubuntu-26.04
    container: fedora:43
    timeout-minutes: 75
    steps:
      # A container is used because GitHub does not offer a Fedora-hosted runner.
      # The distribution under test is Fedora; the Ubuntu label is only its host.
      - name: Install checkout and compiler prerequisites
        shell: bash
        run: |
          dnf install -y git ca-certificates curl tar gzip unzip xz which findutils \
            clang lld llvm-devel llvm-static libzstd-devel libxml2-devel \
            zlib-devel golang java-25-openjdk-devel gcc gcc-c++ make gmp-devel libffi-devel ncurses-devel perl

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pinned Bazelisk
        shell: bash
        run: |
          go install github.com/bazelbuild/bazelisk@v1.29.0
          # Container jobs do not consistently propagate GITHUB_PATH entries
          # into later container steps. Expose the pinned Bazelisk as `bazel`
          # explicitly so both the workflow smoke target and develop.go find it.
          install -m 0755 "$(go env GOPATH)/bin/bazelisk" /usr/local/bin/bazel
          llvm_root="$(llvm-config --prefix)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          # Fedora's /usr/bin/clang has a valid resource directory; the
          # versioned LLVM prefix is for llvm-config metadata, not PATH.
          test -f "$(clang -print-resource-dir)/include/stddef.h"

      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Compiler
        run: cabal update

      - name: Verify toolchain and Go helpers
        shell: bash
        run: |
          go run ./helpers/cmd/develop doctor
          go run ./helpers/cmd/verify-helpers
          go run ./helpers/cmd/verify-examples
          go run ./helpers/cmd/verify-benchmarks
          go run ./helpers/cmd/execution-cases check

      - name: Build and run native compiler suites
        shell: bash
        run: go run ./helpers/cmd/develop test

      - name: Exercise wire decoder mutations
        shell: bash
        run: |
          bazel build //Compiler/Fuzzing:wire_fuzz_smoke
          ./bazel-bin/Compiler/Fuzzing/wire_fuzz_smoke

      - name: Verify ASan and UBSan runtimes and native suites
        shell: bash
        run: go run ./helpers/cmd/develop sanitize address-undefined

      # Fedora runs in a container on GitHub's Ubuntu host. Its TSan runtime
      # cannot reserve shadow memory under that container's host ASLR layout;
      # Tier 2 exercises the separate Linux TSan gate on the native host.

  required:
    name: Compiler Tier 3 Required
    runs-on: ubuntu-26.04
    if: always()
    needs: [fedora-clang]
    steps:
      - name: Require the native and sanitizer host
        run: test '${{ needs.fedora-clang.result }}' = success
