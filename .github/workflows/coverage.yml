name: Component Coverage

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: component-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  native:
    name: Native C++ LCOV
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: coverage-ubuntu-2604-clang
          repository-cache: true

      - name: Install LLVM development and link packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm libc++-dev libc++abi-dev libzstd-dev libxml2-dev zlib1g-dev zstd
          # LLVM built with libc++ from the toolchain release, checked against
          # the digest the repository records; the compiler builds with libc++.
          llvm_root="$(go run ./helpers/cmd/develop llvm)"
          echo "LLVM_ROOT=$llvm_root" >> "$GITHUB_ENV"
          # The profiles are written by the distribution's clang, so they are
          # read by the profile tools of the same release.
          version="$(clang -dumpversion | cut -d. -f1)"
          echo "LLVM_PROFDATA=$(command -v "llvm-profdata-$version" || command -v llvm-profdata)" >> "$GITHUB_ENV"
          echo "LLVM_COV=$(command -v "llvm-cov-$version" || command -v llvm-cov)" >> "$GITHUB_ENV"

      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0
      - name: Resolve frontend package index
        shell: bash
        working-directory: Talac
        run: cabal update

      - name: Run instrumented native suites and export LCOV
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$GITHUB_WORKSPACE/coverage/native"
          mkdir -p "$report_dir"
          export LLVM_PROFILE_FILE="$report_dir/native-%p-%m.profraw"

          # The developer helper owns the component suite matrix. Only build flags
          # differ from the normal native test gate.
          #
          # The runtime library of a native executable is not instrumented.
          # It is linked into the programs the suites build, by the C
          # compiler of the system and without a profile runtime, so an
          # instrumented copy would leave every such program unlinked.
          go run ./helpers/cmd/develop test -- \
            --copt=-fprofile-instr-generate \
            --copt=-fcoverage-mapping \
            '--per_file_copt=^Talac/Runtime/Hosted/.*@-fno-profile-instr-generate,-fno-coverage-mapping' \
            --linkopt=-fprofile-instr-generate

          profiles=("$report_dir"/*.profraw)
          if [[ ! -f "${profiles[0]}" ]]; then
            echo 'The instrumented native tests produced no raw profiles' >&2
            exit 1
          fi
          "$LLVM_PROFDATA" merge -sparse "${profiles[@]}" -o "$report_dir/native.profdata"

          binaries=()
          while IFS= read -r -d '' binary; do
            binaries+=("$binary")
          done < <(find -L bazel-bin/Talac bazel-bin/Interactive -type f -name '*_tests' -print0)
          if [[ "${#binaries[@]}" -lt 16 ]]; then
            echo "Expected at least 16 instrumented native suites; found ${#binaries[@]}" >&2
            exit 1
          fi

          objects=()
          for binary in "${binaries[@]:1}"; do
            objects+=("-object=$binary")
          done

          "$LLVM_COV" export \
            -format=lcov \
            -instr-profile="$report_dir/native.profdata" \
            -ignore-filename-regex='(^|/)(third_party|external|bazel-out)/' \
            "${binaries[0]}" \
            "${objects[@]}" > "$report_dir/native.lcov"
          if ! grep -q '^SF:.*Talac/' "$report_dir/native.lcov"; then
            echo 'The native LCOV report has no compiler source records' >&2
            exit 1
          fi

      - name: Preserve native C++ coverage for the isolated uploader
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-cpp-coverage
          path: coverage/native/native.lcov
          if-no-files-found: error
          retention-days: 1

  kotlin:
    name: Kotlin JVM coverage
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'

      - name: Test Kotlin owners with JaCoCo
        shell: pwsh
        run: |
          foreach ($component in @('Tazel', 'Ecosystem/tala-analyzer', 'Ecosystem/talafmt', 'Ecosystem/talalint')) {
            gradle -p $component test jacocoTestReport
            if ($LASTEXITCODE -ne 0) {
              throw "JaCoCo test/report failed for $component"
            }
            $report = Join-Path $component 'build/reports/jacoco/test/jacocoTestReport.xml'
            if (-not (Test-Path -LiteralPath $report)) {
              throw "No JaCoCo XML report was produced for $component"
            }
          }

      - name: Preserve Kotlin component coverage for the isolated uploader
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kotlin-components-coverage
          path: |
            Tazel/build/reports/jacoco/test/jacocoTestReport.xml
            Ecosystem/tala-analyzer/build/reports/jacoco/test/jacocoTestReport.xml
            Ecosystem/talafmt/build/reports/jacoco/test/jacocoTestReport.xml
            Ecosystem/talalint/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: error
          retention-days: 1

  go:
    name: Go helper coverage
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.26.x
          cache: false

      - name: Test every Go helper with coverage
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force coverage/go | Out-Null
          $report = Join-Path $env:GITHUB_WORKSPACE "coverage/go/helpers.out"
          go -C helpers test -covermode=atomic "-coverprofile=$report" ./...
          if ($LASTEXITCODE -ne 0) { throw "Go helper module coverage failed" }
          if (-not (Test-Path -LiteralPath $report -PathType Leaf)) {
            throw "No Go helper module coverage report was produced"
          }

      - name: Preserve Go helper coverage for the isolated uploader
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: go-tools-coverage
          path: coverage/go/*.out
          if-no-files-found: error
          retention-days: 1

  upload-native-coverage:
    needs: native
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-cpp-coverage
          path: coverage
      - name: Upload native C++ coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: coverage/native.lcov
          flags: native-cpp
          name: native-cpp

  upload-kotlin-coverage:
    needs: kotlin
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kotlin-components-coverage
          path: coverage/kotlin
      - name: Upload Tazel coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: coverage/kotlin/Tazel/build/reports/jacoco/test/jacocoTestReport.xml
          flags: kotlin-project-system
          name: kotlin-project-system
      - name: Upload Analyzer coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: coverage/kotlin/Ecosystem/tala-analyzer/build/reports/jacoco/test/jacocoTestReport.xml
          flags: kotlin-analyzer
          name: kotlin-analyzer
      - name: Upload Formatter coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: coverage/kotlin/Ecosystem/talafmt/build/reports/jacoco/test/jacocoTestReport.xml
          flags: kotlin-formatter
          name: kotlin-formatter
      - name: Upload Linter coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: coverage/kotlin/Ecosystem/talalint/build/reports/jacoco/test/jacocoTestReport.xml
          flags: kotlin-linter
          name: kotlin-linter

  upload-go-coverage:
    needs: go
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: go-tools-coverage
          path: coverage/go
      - name: Build the coverage report list
        shell: bash
        run: |
          set -euo pipefail
          files="$(find coverage/go -type f -name '*.out' -print | sort | paste -sd, -)"
          if [[ -z "$files" ]]; then
            echo 'The Go coverage artifact contains no reports' >&2
            exit 1
          fi
          echo "CODECOV_GO_FILES=$files" >> "$GITHUB_ENV"
      - name: Upload Go helper coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          plugins: noop
          files: ${{ env.CODECOV_GO_FILES }}
          flags: go-tools
          name: go-tools
