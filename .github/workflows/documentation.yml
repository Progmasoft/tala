name: API Documentation

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-api:
    name: Doxygen and Haddock
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Doxygen
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen
          doxygen --version

      - name: Install GHC and Cabal
        uses: haskell/ghcup-setup@269e121e9e7528761aca5a606a53fe9d04cd6658 # v1.2.3
        with:
          ghc: 9.10.3
          cabal: 3.16.1.0

      - name: Configure Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false

      - name: Resolve Haskell package index
        shell: bash
        run: cabal update

      - name: Test documentation coverage gate
        shell: bash
        run: go -C helpers test ./cmd/verify-docs

      - name: Verify public API documentation
        shell: bash
        run: go run ./helpers/cmd/verify-docs
