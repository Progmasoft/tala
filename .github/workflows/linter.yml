name: Linter

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: talalint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linter:
    name: Kotlin DSL and linter
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.1"

      - name: Check linter configuration DSL
        shell: pwsh
        run: .\gradlew.bat -p Ecosystem/talalint spotlessCheck test

      - name: Update Hackage package index
        shell: pwsh
        working-directory: Talac
        run: cabal update

      - name: Build talalint
        shell: pwsh
        working-directory: Talac
        run: cabal build talalint

      - name: Test talalint
        shell: pwsh
        working-directory: Talac
        run: cabal test talalint-tests

      - name: Check package metadata
        shell: pwsh
        working-directory: Ecosystem/talalint
        run: cabal check

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
