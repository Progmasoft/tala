name: Benchmarks

on:
  pull_request:
  # The default branch only. A branch that has a pull request is tested by
  # the pull request; testing its pushes as well ran every job twice.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: $/.github/workflows/changes.yml
    permissions:
      contents: read
      pull-requests: read

  smoke:
    name: Build and smoke benchmark surfaces
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelisk-cache: true
          disk-cache: benchmark-windows-clangcl
          repository-cache: true

      # Native benchmark targets now exercise the same LLVM-backed ADT layer
      # as the production verifier. Keep this setup aligned with compiler-tier1.yml so
      # benchmark smoke builds never fall back to a runner-bundled toolchain.
      - name: Restore LLVM development package
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.tool_cache }}\llvm-dev-22.1.6
          key: llvm-dev-22.1.6-x86_64-windows-msvc

      - name: Install LLVM development package
        shell: pwsh
        run: |
          $llvmRoot = Join-Path $env:RUNNER_TOOL_CACHE "llvm-dev-22.1.6"
          $llvmConfig = Join-Path $llvmRoot "bin\llvm-config.exe"
          if (-not (Test-Path $llvmConfig)) {
            New-Item -ItemType Directory -Force $llvmRoot | Out-Null
            $archive = Join-Path $env:RUNNER_TEMP "llvm-dev.tar.xz"
            curl.exe -L --fail --retry 4 --retry-delay 5 `
              -o $archive `
              "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.6/clang%2Bllvm-22.1.6-x86_64-pc-windows-msvc.tar.xz"
            tar.exe -xf $archive -C $llvmRoot --strip-components=1
          }
          if (-not (Test-Path $llvmConfig)) {
            throw "The official LLVM development archive does not contain llvm-config.exe"
          }
          "LLVM_ROOT=$llvmRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          (Join-Path $llvmRoot "bin") | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build native benchmark programs
        shell: pwsh
        run: >-
          bazel build
          //Talac/Codegen/Xpp/Benches:xpp_benches
          //Talac/Codegen/Xmm/Benches:xmm_benches
          //Talac/Core/Benches:core_benches
          //Talac/Core/CorePrep/Benches:coreprep_benches
          //Interactive/Benches:interactive_benches

      - name: Smoke native benchmark registration
        shell: pwsh
        run: |
          .\bazel-bin\Talac\Core\Benches\core_benches.exe --benchmark_filter="CoreVerify/8" --benchmark_min_time=0.001s
          .\bazel-bin\Talac\Core\CorePrep\Benches\coreprep_benches.exe --benchmark_filter="Verify/4" --benchmark_min_time=0.001s
          .\bazel-bin\Talac\Codegen\Xpp\Benches\xpp_benches.exe --benchmark_filter="Verify/4" --benchmark_min_time=0.001s
          .\bazel-bin\Talac\Codegen\Xmm\Benches\xmm_benches.exe --benchmark_filter="Lower/4" --benchmark_min_time=0.001s
          .\bazel-bin\Interactive\Benches\interactive_benches.exe --benchmark_filter="BenchmarkCellLowerAddInvokeReset" --benchmark_min_time=0.001s

      - name: Update Haskell package index
        shell: pwsh
        run: cabal update

      - name: Build Haskell Criterion benchmarks
        shell: pwsh
        working-directory: Talac
        run: cabal build tala-core:bench:core-benches --enable-benchmarks

      - name: Smoke Haskell Criterion benchmarks
        shell: pwsh
        working-directory: Talac
        run: cabal bench tala-core:core-benches --enable-benchmarks --benchmark-options="-n 1 --match pattern Core/Verify/8"

      - name: Check patch hygiene
        shell: pwsh
        run: git diff --check
