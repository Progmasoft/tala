# Coverage is followed for each language on its own. The repository holds a
# Haskell frontend, a C++ backend and runtime, and Go tools; one figure for
# all of them hides a fall in one behind a rise in another. Every upload
# carries a flag, and each flag has a status of its own
# for the whole of its sources and for the lines a pull request changes.
#
# The statuses are informational: they show on a pull request and never fail
# it. A threshold that fails a pull request is a decision to make once the
# figures have been watched for a while.
coverage:
  status:
    project:
      default:
        informational: true
      haskell-frontend:
        flags:
          - haskell-frontend
        informational: true
      native-cpp:
        flags:
          - native-cpp
        informational: true
      go-tools:
        flags:
          - go-tools
        informational: true
    patch:
      default:
        informational: true
      haskell-frontend:
        flags:
          - haskell-frontend
        informational: true
      native-cpp:
        flags:
          - native-cpp
        informational: true
      go-tools:
        flags:
          - go-tools
        informational: true

# The sources each flag answers for. A report is only counted for the paths
# of its flag, so that a file is never measured by a suite that does not own
# it. A flag whose suite did not run for a commit keeps its last figure
# instead of dropping to nothing. The Haskell suite, like the native one, is
# skipped for a pull request that changes nothing the native build reads.
flags:
  haskell-frontend:
    paths:
      - Talac/Haskell/
    carryforward: true
  native-cpp:
    paths:
      - Talac/
      - Interactive/
      - "!Talac/Haskell/"
    carryforward: true
  go-tools:
    paths:
      - helpers/
    carryforward: true

comment:
  layout: "reach, diff, flags, files"
  require_changes: true
